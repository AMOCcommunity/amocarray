[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=45",
  "setuptools-scm[toml]>=8.0",
  "wheel",
]

[project]
name = "AMOCatlas"
description = "Python project to read data from arrays measuring the Atlantic meridional overturning circulation"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
  { name = "Isabelle Schmitz", email = "isabelle.schmitz@uni-hamburg.de" },
]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [
  "dependencies",
  "version",
]
urls.documentation = "https://github.com/AMOCcommunity/AMOCatlas"
urls.homepage = "https://github.com/AMOCcommunity/AMOCatlas"
urls.repository = "https://github.com/AMOCcommunity/AMOCatlas"

[tool.setuptools]
packages = ["amocatlas", "amocatlas.metadata", "amocatlas.data_sources", "amocatlas.vocabulary"]
include-package-data = true

[tool.setuptools.package-data]
# vocabulary is listed explicitly (not globbed) so the working draft — amocvocab_draft.yml
# and amocvocab_draft.schema.json — is repo-tracked but NOT shipped in the wheel.
amocatlas = [
    "metadata/*.yml",
    "metadata/*.json",
    "vocabulary/amocvocab.yml",
    "vocabulary/amocvocab.schema.json",
    "vocabulary/cf_standard_names.json",
]

[tool.setuptools.dynamic]
dependencies = { file = [
  "requirements.txt",
] }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "amocatlas/_version.py"
write_to_template = "__version__ = '{version}'"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>[0-9]+(?:\\.[0-9]+)*[a-z0-9]*)$"
# tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# ruff handles both linting (below) and formatting (ruff format), replacing black.

[tool.ruff.lint]
select = [
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # pyflakes errors
  "W",       # pycodestyle warnings
  "C90",     # mccabe complexity
  "ANN",     # type annotations
  "B",       # flake8-bugbear
  "BLE",     # bleach checks
  "TRY",     # tryceratops
  "ARG",     # flake8-arguments
  "SLF",     # flake8-self
]
ignore = [
  "D107",    # missing docstring in __init__
  "D203",    # 1 blank line required before class docstring
  "D213",    # multi-line summary docstring style
  "D401",    # first line should be in imperative mood
  "E501",    # line‑length
  "PLR0913", # too many arguments
  "C901",    # complexity
  "TRY003",  # avoid specifying long messages outside exception class
  "D205",    # TODO: 1 blank line required between summary line and description - fix individually later
  "D400",    # TODO: First line should end with a period - fix individually later
  "D415",    # TODO: First line should end with a period, question mark, or exclamation point - fix individually later
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "SLF001", "ANN", "D103", "D100", "ARG001", "ARG002", "ARG005", "BLE001"]  # Allow module level imports, private member access, missing type annotations, missing docstrings, unused function/method/lambda arguments (mock stubs), and blind exceptions in tests
"notebooks/*" = ["ANN", "F821"]  # Example notebooks: type annotations not expected; cross-cell names ruff cannot resolve per-cell
"amocatlas/logger.py" = ["ANN401"]  # Allow Any type for *args in logging functions (standard pattern)
"amocatlas/report.py" = ["BLE001"]  # Allow broad exception handling in plot generation where many failure modes exist

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
