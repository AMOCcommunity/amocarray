metadata:
  program: "Pan-Arctic Gateway transports since 2004"
  description: >
    Input data and adjusted data derived with an inverse model of ocean velocity, temperature and salinity obtained from ocean moorings and hydrography from the four main Arctic Gateways Fram Strait, Barents Sea Opening, Bering Strait and Davis Strait
  project: "Explaining and predicting the ocean conveyor belt, The Fram Strait Arctic Outflow Observatory"
  weblink: "https://doi.org/10.21334/NPOLAR.2025.80B69907"
  comment: "Dataset accessed and processed via http://github.com/AMOCcommunity/amocatlas"
  acknowledgement: >
    The mooring data from the Arctic Gateways are provided by the Norwegian Polar Institute (Tromsø, Norway), the Alfred Wegener Institute (Bremerhaven, Germany), the Institute for Marine Research (Bergen, Norway) and the Applied Physics Laboratory, Univ. of Washington (Seattle, USA).
  license:  
  citation: >
    Fredriksen, H., de Steur, L., von Appen, W., Ingvaldsen, R., McPherson, R., Lee, C., Lenetsky, J., & Woodgate, R. (2025). Pan-Arctic Gateway transports since 2004 [Dataset]. Norwegian Polar Institute. https://doi.org/10.21334/NPOLAR.2025.80B69907
  featureType: "timeSeriesProfile"
  Conventions: ""
  time_coverage_start: '2004-10-15'
  time_coverage_end: '2022-05-15'
  contributor_name: "Hege-Beate Fredriksen, Laura de Steur"
  contributor_role: "originator, PI"
  contributor_role_vocabulary: "http://vocab.nerc.ac.uk/search_nvs/W08/"
  creator_name_overwrite: " "
  creator_url_overwrite: " "
  creator_email_overwrite: " "
  creator_type_overwrite: " "
  publisher_name_overwrite: " "
  publisher_email_overwrite: " "
  institution: " "
  contributing_institutions: "Norwegian Polar Institute, Alfred Wegener Institute, Institute for Marine Research, APL-UW"
  contributing_institutions_role: "publisher, "

files:
  Adjusted_fulldepth/BarentsSeaOpening_adjusted_v_fulldepth.nc:
    source_url: "https://doi.org/10.21334/NPOLAR.2025.80B69907"
    data_product: "Pan-Arctic Gateway transports since 2004 - Barents Sea Opening"
    variable_mapping:
      "time": TIME
      "depth": DEPTH
      "lon": LONGITUDE
      "lat": LATITUDE
      "v": VCUR
    original_variable_metadata:
      time:
        long_name: "Time"
        description: "Time in datetime format"
        units: "datetime64[ns]"
        standard_name: "time"
      depth:
        long_name: "Depth"
        description: "Depth, interpolated to 4 m resolution"
        units: m
        standard_name: "depth"
      lon:
        long_name: "Longitude"
        description: "Longitude of zonal sections across which freshwater transport is computed."
        units: degree_east
        standard_name: "longitude"
      lat:
        long_name: "Latitude"
        description: "Latitude of zonal sections across which freshwater transport is computed."
        units: degree_north
        standard_name: "latitude"
      CT:
        long_name: "Cons. Temperature"
        description: "Conservative Temperature (TEOS-10)"
        units: degree_C
        standard_name: "sea_water_conservative_temperature"
      SA:
        long_name: "Abs. Salinity"
        description: "Absolute Salinity (TEOS-10)"
        units: "g kg-1"
        standard_name: "sea_water_absolute_salinity"
      v:
        long_name: "V Velocity"
        description: "Northward Velocity component"
        units: "m s-1"
        standard_name: "northward_sea_water_velocity"
