metadata:
  program: "FBC"
  description: "FBC Overflow transport time series"
  project: "B. Hansen et al.: A stable Faroe Bank Channel overflow"
  weblink: https://envofar.fo/data/index.php?dir=Timeseries&sort=N&order=A 
  comment: Dataset accessed and processed via http://github.com/AMOCcommunity/amocatlas
  acknowledgment: >
    The authors wish to thank captains and crew on the RV Magnus Heinason as well as Regin Kristiansen for unfailing support during measurements at sea, and Ebba Mortensen for data processing. Funding for the in situ measurements has been obtained from the Environmental Research Programme of the Nordic Council of Ministers (NMR) 1993–1998, from national Nordic research councils, from the Danish DANCEA programme, and from the European Framework Programs, lately under grant agreement no. GA212643 (THOR) and under grant agreement no. 308299 (NACLIM). Analysis and preparation of this manuscript was mainly funded by the NACLIM project. We thank three anonymous referees for very constructive comments.
  license: 
  featureType: timeSeries
  time_coverage_start: '1995-11-13'
  time_coverage_end: '2023-05-19'

