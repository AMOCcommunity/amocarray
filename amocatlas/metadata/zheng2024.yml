files:
  atl_mft_2000_extend_gpcp_oaflux.nc:
    data_product: "An observation based estimate of the Atlantic meridional freshwater transport"
    variable_mapping:
      "time": TIME
      "lat": LATITUDE
      "mft": MFT
    original_variable_metadata:
      time:
        long_name: "Time"
        description: "Time in datetime format"
        units: "datetime64[ns]"
        standard_name: "time"
      lat:
        long_name: "Latitude of zonal sections"
        description: "Latitude of zonal sections across which freshwater transport is computed. Values lie between 34.5°S and 66.5°N."
        units: degree_north
        standard_name: "latitude"
      mft:
        long_name: "Freshwater"
        description: "An Observation-Based Estimate of Atlantic Meridional Freshwater Transport. AMFT given by RAPID array at 26.5°N was integrated southward and northward in combination with ocean freshwater content (calculated by salinity) and surface freshwater flux, with the residual of the freshwater budget equation being the AMFT."
        units: Sverdrup
        standard_name: "northward_ocean_freshwater_transport"