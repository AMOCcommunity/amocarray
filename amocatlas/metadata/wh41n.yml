    data_product: "Transport components from ARGO and ERA5"
    variable_mapping:
      Vek: VEL_EKMAN
      trans: TRANS_GEO
      moc: MOC
      depth: DEPTH
      lat: LATITUDE
      lon: LONGITUDE
