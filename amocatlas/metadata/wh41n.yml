metadata:
  program: "41N"
  description: "41N transport estimates dataset"
  project: "Atlantic Meridional Overturning Circulation Near 41N from Altimetry and Argo Observations"
  weblink: https://zenodo.org/records/14681441
  comment: Dataset accessed and processed via http://github.com/AMOCcommunity/amocatlas
  acknowledgment: >
    These data were collected and made freely available by the International Argo Program and the national programs that contribute to it.  (https://argo.ucsd.edu,  https://www.ocean-ops.org).  The Argo Program is part of the Global Ocean Observing System.
  license:
  featureType: timeSeries
  Convections: CF-1.8, ACDD-1.3
  time_coverage_start: '2002-02-15'
  time_coverage_end: '2024-12-16'
  platform_type: Argo floats

files:
  hobbs_willis_amoc41N_tseries.txt:
    source_url: https://zenodo.org/records/14681441
    data_product: "Atlantic Meridional Overturning Circulation Near 41N from Altimetry and Argo Observations"
    acknowledgement:
    variable_mapping:
      "Ekman Volume Transport (Sverdrups)": TRANS_EKMAN
      "Northward Geostrophic Transport (Sverdrups)": TRANS_GEO
      "Meridional Overturning Volume Transport (Sverdrups)": MOC
      "Meridional Overturning Heat Transport (PetaWatts)": MHT
    variables:
      TRANS_EKMAN:
        long_name: "Ekman transport"
        description: "Ekman Volume Transport"
        units: Sverdrup
        standard_name: ocean_volume_transport_across_line
      TRANS_GEO:
        long_name: "Northward Geostrophic Transport"
        description: "Northward Geostrophic Transport"
        units: Sverdrup
        standard_name: ocean_volume_transport_across_line
      MOC:
        long_name: "Meridional Overturning Transport"
        description: "Meridional Overturning Volume Transport"
        units: Sverdrup
        standard_name: ocean_meridional_overturning_transport
      MHT:
        long_name: "Meridional Heat Transport"
        description: "Meridional Overturning Heat Transport"
        units: PW
        standard_name: northward_ocean_heat_transport

  trans_ARGO_ERA5.nc:
    source_url: https://zenodo.org/records/14681441
    data_product: "Transport components from ARGO and ERA5"
    variable_mapping:
      Vek: VEL_EKMAN
      trans: TRANS_GEO
      moc: MOC
    variables:
      VEL_EKMAN:
        long_name: "Ekman transport"
        description: "Ekman transport from ERA5 reanalysis"
        units: Sverdrup
        standard_name: ocean_volume_transport_across_line
      TRANS_GEO:
        long_name: "Geostrophic transport"
        description: "Observed geostrophic transport from ARGO"
        units: Sverdrup
        standard_name: ocean_volume_transport_across_line
      MOC:
        long_name: "Meridional Overturning Circulation"
        description: "Overturning circulation transport"
        units: Sverdrup
        standard_name: ocean_meridional_overturning_transport

  Q_ARGO_obs_dens_2000depth_ERA5.nc:
    source_url: https://zenodo.org/records/14681441
    data_product: "Heat transport based on various assumptions about temperature below 2000m"
    variable_mapping:
      Qnet: MHT_NET
      Qek: MHT_EKMAN
      Q: MHT
    variables:
      MHT_NET:
        long_name: "Net heat transport"
        description: "Net meridional heat transport"
        units: PW
        standard_name: northward_ocean_heat_transport
      MHT_EKMAN:
        long_name: "Ekman heat transport"
        description: "Ekman meridional heat transport"
        units: PW
        standard_name: northward_ocean_heat_transport
      MHT:
        long_name: "Observed heat transport"
        description: "Observed meridional heat transport"
        units: PW
        standard_name: northward_ocean_heat_transport
