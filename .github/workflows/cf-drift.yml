name: CF table drift check

# The amocvocab validator reads a committed, pinned CF subset
# (amocatlas/vocabulary/cf_standard_names.json) so builds are reproducible. This scheduled
# job is the other half: it fetches the LIVE CF standard-name table, re-derives the subset,
# and opens an issue if the live table has moved on — so a pinned version is a deliberate
# choice, not silent staleness. It never blocks a PR.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  cf_drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e . --no-deps

      - name: Fetch live CF table and re-derive subset
        run: |
          curl -sSL -o /tmp/cf-table.xml \
            https://cfconventions.org/Data/cf-standard-names/current/src/cf-standard-name-table.xml
          python -m amocatlas.vocabulary.build_cf_subset --xml /tmp/cf-table.xml --out /tmp/cf_new.json

      - name: Compare against committed subset
        id: diff
        run: |
          python - << 'PY' >> "$GITHUB_OUTPUT"
          import json
          old = json.load(open("amocatlas/vocabulary/cf_standard_names.json"))
          new = json.load(open("/tmp/cf_new.json"))
          oe, ne = old["entries"], new["entries"]
          added = sorted(set(ne) - set(oe))
          removed = sorted(set(oe) - set(ne))
          changed = sorted(k for k in set(oe) & set(ne) if oe[k] != ne[k])
          drift = bool(added or removed or changed or old["label"] != new["label"])
          print(f"drift={'true' if drift else 'false'}")
          lines = [
              f"Live CF table: **{new['label']}** ({new['entry_count']} entries).",
              f"Committed subset: **{old['label']}** ({old['entry_count']} entries).",
              "",
              f"- added: {len(added)}",
              f"- removed: {len(removed)}",
              f"- changed canonical units: {len(changed)}",
          ]
          if added:
              lines.append("\nAdded (first 20): " + ", ".join(f"`{n}`" for n in added[:20]))
          if removed:
              lines.append("\nRemoved (first 20): " + ", ".join(f"`{n}`" for n in removed[:20]))
          if changed:
              lines.append("\nUnit changes (first 20): " + ", ".join(
                  f"`{n}` {oe[n]!r}->{ne[n]!r}" for n in changed[:20]))
          body = "\n".join(lines)
          # Multiline output for the next step.
          print("body<<EOF")
          print(body)
          print("EOF")
          PY

      - name: Open issue on drift
        if: steps.diff.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.diff.outputs.body }}
        run: |
          existing=$(gh issue list --state open --search "CF standard-name table drift in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open drift issue already exists; skipping."
            exit 0
          fi
          printf '%s\n\n---\nRegenerate with: `python -m amocatlas.vocabulary.build_cf_subset --xml cf-table.xml`, then re-verify every affected amocvocab entry and bump `cf_standard_name_table`.\n' "$BODY" \
            | gh issue create --title "CF standard-name table drift detected" --label "amocvocab" --body-file -
