name: Validate amocvocab

# The amocvocab vocabulary is published for other groups to adopt, so a fabricated CF
# standard_name or a non-convertible unit must never merge. This runs the full validator
# (schema + name==key + referential integrity + CF-name existence + UDUNITS-2 unit
# parse/convertibility) against the committed CF subset (amocatlas/vocabulary/
# cf_standard_names.json) — no network, so a green build stays reproducible. Drift against
# the live CF table is detected separately by cf-drift.yml.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'amocatlas/vocabulary/**'
      - 'amocatlas/metadata/**'
      - 'requirements*.txt'
      - '.github/workflows/amocvocab.yml'
  push:
    branches:
      - main
    paths:
      - 'amocatlas/vocabulary/**'

jobs:
  validate_amocvocab:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pyudunits2
          python -m pip install -e . --no-deps

      - name: Validate amocvocab.yml (against committed CF subset)
        run: |
          python -m amocatlas.vocabulary.validate_amocvocab

      - name: Vocabulary tests
        run: |
          pytest tests/test_amocvocab.py -v
